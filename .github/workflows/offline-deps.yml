name: Build offline ORAM dependency bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/offline-deps.yml'
      - 'scripts/verilog_ci_agent.sh'

permissions:
  contents: write
  actions: read

concurrency:
  group: offline-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-offline-deps:
    name: Build Ubuntu 22.04 offline dependency bundle and Verilog CI
    runs-on: ubuntu-22.04

    steps:
      - name: Check out ORAM repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Build bundle, run Verilog CI, write logs, commit logs, then report status
        shell: bash
        run: |
          set +e
          set -o pipefail

          # Start from clean generated directories. Do not commit .deb payloads to git;
          # they are uploaded as workflow artifacts instead.
          rm -rf ci-logs metadata offline-debs
          mkdir -p ci-logs metadata offline-debs

          LOG="ci-logs/offline-deps-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          LATEST="ci-logs/latest-offline-deps.md"
          STATUS=0

          log_line() {
            printf '%s\n' "$*" | tee -a "$LOG"
          }

          run_logged() {
            local title="$1"
            shift
            log_line ""
            log_line "## ${title}"
            log_line ""
            log_line '```text'
            "$@" 2>&1 | tee -a "$LOG"
            local rc=${PIPESTATUS[0]}
            log_line '```'
            log_line ""
            log_line "Exit code: ${rc}"
            if [ "$rc" -ne 0 ] && [ "$STATUS" -eq 0 ]; then
              STATUS="$rc"
            fi
            return 0
          }

          cat > "$LOG" <<EOF
          # Offline dependency and Verilog CI log

          - Repository: ${GITHUB_REPOSITORY}
          - Branch/ref: ${GITHUB_REF}
          - Ref name: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Workflow: ${GITHUB_WORKFLOW}
          - Run ID: ${GITHUB_RUN_ID}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Runner OS: ${RUNNER_OS}
          - Started UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')

          EOF

          packages=(
            build-essential
            make
            python3
            iverilog
            verilator
            yosys
            gtkwave
            coq
            ocaml-findlib
          )
          printf '%s\n' "${packages[@]}" > metadata/top-level-packages.txt

          run_logged "Repository state" bash -lc 'pwd; git status --short --branch; git remote -v; git rev-parse --abbrev-ref HEAD; git log -3 --oneline'

          run_logged "APT update" bash -lc 'sudo apt-get update'

          run_logged "Install resolver and runner tools" bash -lc '
            sudo apt-get install -y apt-rdepends dpkg-dev apt-utils
            sudo apt-get install -y build-essential make python3 iverilog verilator yosys gtkwave coq ocaml-findlib
            command -v apt-rdepends
            command -v dpkg-scanpackages
            command -v iverilog
            command -v vvp
            command -v verilator
            command -v yosys
          '

          run_logged "Resolve real apt dependency closure" bash -lc '
            set -euo pipefail
            packages=(build-essential make python3 iverilog verilator yosys gtkwave coq ocaml-findlib)
            : > metadata/package-list.raw.txt
            for pkg in "${packages[@]}"; do
              apt-rdepends "$pkg" >> metadata/package-list.raw.txt
            done
            awk '\''/^[[:alnum:]][[:alnum:].+:-]+$/ {print $1}'\'' metadata/package-list.raw.txt \
              | sort -u \
              | while read -r pkg; do
                  if apt-cache show "$pkg" >/dev/null 2>&1; then
                    printf "%s\n" "$pkg"
                  fi
                done \
              | sort -u > metadata/package-list.txt
            printf "%s\n" "${packages[@]}" >> metadata/package-list.txt
            sort -u -o metadata/package-list.txt metadata/package-list.txt
            test -s metadata/package-list.txt
            wc -l metadata/package-list.txt
            head -120 metadata/package-list.txt
          '

          run_logged "Download .deb files" bash -lc '
            set -euo pipefail
            mkdir -p offline-debs
            cd offline-debs
            while read -r pkg; do
              [ -n "$pkg" ] || continue
              echo "Downloading $pkg"
              apt-get download "$pkg"
            done < ../metadata/package-list.txt
            cd ..
            find offline-debs -maxdepth 1 -type f -name "*.deb" | sort > metadata/downloaded-debs.txt
            deb_count=$(wc -l < metadata/downloaded-debs.txt)
            echo "Downloaded deb count: $deb_count"
            test "$deb_count" -gt 0
            dpkg-scanpackages offline-debs /dev/null | gzip -9c > offline-debs/Packages.gz
            sha256sum offline-debs/*.deb > metadata/SHA256SUMS
            cp metadata/package-list.txt offline-debs/package-list.txt
            cp metadata/SHA256SUMS offline-debs/SHA256SUMS
            du -sh offline-debs
            head -40 metadata/downloaded-debs.txt
          '

          run_logged "Create offline installer script" bash -lc '
            cat > offline-debs/install-offline-debs.sh <<'\''EOF'\''
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          sudo apt-get install -y ./$(ls *.deb | tr "\n" " ")
          EOF
            chmod +x offline-debs/install-offline-debs.sh
            cp offline-debs/install-offline-debs.sh metadata/install-offline-debs.sh
          '

          {
            echo '# Verilog project/testbench discovery'
            echo
            echo '## Project files'
            echo '```text'
            find . -type f \( -name '*.prj' -o -name '*.xpr' -o -name 'Makefile' \) | sort
            echo '```'
            echo
            echo '## Testbench-looking Verilog files'
            echo '```text'
            find . -type f \( -iname '*test*.v' -o -iname '*tb*.v' \) | sort
            echo '```'
            echo
            echo '## Simulator/tool versions from runner'
            echo '```text'
            iverilog -V | head -80 || true
            verilator --version || true
            yosys -V || true
            echo '```'
          } > metadata/oram-testbench-discovery.md

          log_line ""
          log_line "## Verilog project/testbench discovery"
          cat metadata/oram-testbench-discovery.md | tee -a "$LOG"

          run_logged "Agentic Verilog CI harness" bash scripts/verilog_ci_agent.sh

          log_line ""
          log_line "## Final status before commit"
          log_line ""
          log_line "- Captured status: ${STATUS}"
          log_line "- Finished UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          cp "$LOG" "$LATEST"

          log_line ""
          log_line "## Commit logs and metadata back to repository"
          log_line ""
          log_line '```text'
          {
            set -x
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git rm -r --ignore-unmatch ci-logs metadata offline-debs
            git add ci-logs metadata
            git status --short
            git diff --cached --stat
            if git diff --cached --quiet; then
              echo "No generated changes found. Creating heartbeat file."
              date -u '+%Y-%m-%dT%H:%M:%SZ' > ci-logs/last-run-heartbeat.txt
              git add ci-logs/last-run-heartbeat.txt
            fi
            git commit -m "Add offline dependency and Verilog CI logs for run ${GITHUB_RUN_ID}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          } 2>&1 | tee -a "$LOG"
          COMMIT_RC=${PIPESTATUS[0]}
          log_line '```'
          log_line "Commit/push exit code: ${COMMIT_RC}"

          cp "$LOG" "$LATEST"
          if [ "$COMMIT_RC" -eq 0 ]; then
            git add "$LOG" "$LATEST" ci-logs/latest-verilog-ci.md metadata/verilog-test-results.tsv metadata/verilog-ci-summary.md || true
            git commit -m "Update CI commit transcript for run ${GITHUB_RUN_ID}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

          if [ "$COMMIT_RC" -ne 0 ]; then
            exit "$COMMIT_RC"
          fi
          exit "$STATUS"

      - name: Upload offline .deb bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oram-ubuntu22.04-debs
          path: offline-debs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload CI metadata and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oram-ci-metadata-and-logs
          path: |
            metadata/
            ci-logs/
          if-no-files-found: warn
          retention-days: 14
