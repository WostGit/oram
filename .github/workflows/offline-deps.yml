name: Build offline ORAM dependency bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/offline-deps.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: offline-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-offline-deps:
    name: Build Ubuntu 22.04 offline dependency bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Check out ORAM repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Build bundle, write logs, commit logs, then report status
        shell: bash
        run: |
          set +e
          set -o pipefail

          mkdir -p ci-logs offline-debs metadata
          LOG="ci-logs/offline-deps-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          LATEST="ci-logs/latest-offline-deps.md"
          STATUS=0

          log_line() {
            printf '%s\n' "$*" | tee -a "$LOG"
          }

          run_logged() {
            local title="$1"
            shift
            log_line ""
            log_line "## ${title}"
            log_line ""
            log_line '```text'
            "$@" 2>&1 | tee -a "$LOG"
            local rc=${PIPESTATUS[0]}
            log_line '```'
            log_line ""
            log_line "Exit code: ${rc}"
            if [ "$rc" -ne 0 ] && [ "$STATUS" -eq 0 ]; then
              STATUS="$rc"
            fi
            return 0
          }

          cat > "$LOG" <<EOF
          # Offline dependency CI log

          - Repository: ${GITHUB_REPOSITORY}
          - Branch/ref: ${GITHUB_REF}
          - Ref name: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Workflow: ${GITHUB_WORKFLOW}
          - Run ID: ${GITHUB_RUN_ID}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Runner OS: ${RUNNER_OS}
          - Started UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')

          EOF

          run_logged "Repository state" bash -lc 'pwd; git status --short --branch; git remote -v; git rev-parse --abbrev-ref HEAD; git log -1 --oneline'

          run_logged "APT update" bash -lc 'sudo apt-get update'

          packages=(
            build-essential
            make
            python3
            iverilog
            verilator
            yosys
            gtkwave
            coq
            ocaml-findlib
          )

          run_logged "Resolve apt package closure" bash -lc '
            packages=(build-essential make python3 iverilog verilator yosys gtkwave coq ocaml-findlib)
            apt-cache depends --recurse --no-recommends \
              --no-suggests --no-conflicts --no-breaks \
              --no-replaces --no-enhances "${packages[@]}" \
              | awk '\''/^  Depends: / {print $2} /^[[:alnum:]][[:alnum:].+:-]+$/ {print $1}'\'' \
              | sed '\''s/<//; s/>//'\'' \
              | sort -u > metadata/package-list.txt
            printf "%s\n" "${packages[@]}" >> metadata/package-list.txt
            sort -u -o metadata/package-list.txt metadata/package-list.txt
            wc -l metadata/package-list.txt
            head -100 metadata/package-list.txt
          '

          run_logged "Download .deb files" bash -lc '
            mkdir -p offline-debs
            cd offline-debs
            xargs -a ../metadata/package-list.txt -r apt-get download
            cd ..
            dpkg-scanpackages offline-debs /dev/null | gzip -9c > offline-debs/Packages.gz
            sha256sum offline-debs/*.deb > metadata/SHA256SUMS
            cp metadata/package-list.txt offline-debs/package-list.txt
            cp metadata/SHA256SUMS offline-debs/SHA256SUMS
            find offline-debs -maxdepth 1 -type f -name "*.deb" | sort > metadata/downloaded-debs.txt
            wc -l metadata/downloaded-debs.txt
            du -sh offline-debs
          '

          {
            echo '# Verilog project/testbench discovery'
            echo
            echo '## Project files'
            echo '```text'
            find . -type f \( -name '*.prj' -o -name '*.xpr' -o -name 'Makefile' \) | sort
            echo '```'
            echo
            echo '## Testbench-looking Verilog files'
            echo '```text'
            find . -type f \( -iname '*test*.v' -o -iname '*tb*.v' \) | sort
            echo '```'
            echo
            echo '## Simulator/tool versions from runner'
            echo '```text'
            iverilog -V | head -80 || true
            verilator --version || true
            yosys -V || true
            echo '```'
          } > metadata/oram-testbench-discovery.md

          log_line ""
          log_line "## Verilog project/testbench discovery"
          cat metadata/oram-testbench-discovery.md | tee -a "$LOG"

          log_line ""
          log_line "## Final status before commit"
          log_line ""
          log_line "- Captured status: ${STATUS}"
          log_line "- Finished UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          cp "$LOG" "$LATEST"

          log_line ""
          log_line "## Commit logs back to repository"
          log_line ""
          log_line '```text'
          {
            set -x
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git add ci-logs metadata offline-debs/package-list.txt offline-debs/SHA256SUMS offline-debs/Packages.gz
            git status --short
            git diff --cached --stat
            if git diff --cached --quiet; then
              echo "No committed-log changes found. Creating heartbeat file."
              date -u '+%Y-%m-%dT%H:%M:%SZ' > ci-logs/last-run-heartbeat.txt
              git add ci-logs/last-run-heartbeat.txt
            fi
            git commit -m "Add offline dependency CI logs for run ${GITHUB_RUN_ID}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          } 2>&1 | tee -a "$LOG"
          COMMIT_RC=${PIPESTATUS[0]}
          log_line '```'
          log_line "Commit/push exit code: ${COMMIT_RC}"

          # Try one more time to include the commit transcript itself in latest log.
          cp "$LOG" "$LATEST"
          if [ "$COMMIT_RC" -eq 0 ]; then
            git add "$LOG" "$LATEST"
            git commit -m "Update offline dependency commit transcript for run ${GITHUB_RUN_ID}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

          if [ "$COMMIT_RC" -ne 0 ]; then
            exit "$COMMIT_RC"
          fi
          exit "$STATUS"

      - name: Upload offline .deb bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oram-ubuntu22.04-debs
          path: offline-debs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ORAM discovery metadata and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oram-discovery-metadata-and-logs
          path: |
            metadata/
            ci-logs/
          if-no-files-found: warn
          retention-days: 14
